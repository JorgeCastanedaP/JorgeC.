title: "Jorge Castaneda's Academic Website"
author: "Jorge Castaneda"
description: "Jorge Castaneda's Academic Website"
permalink: /:title/
lang: "en"
excerpt_separator: "\n\n\n"
date_format: "%B %d, %Y"

# Layout

show_excerpts: false       # show article excerpts on the home page
show_frame: true           # adds a gray frame to the site
show_sidebar: false        # show a sidebar instead of the usual header
minimal: false             # use a dark header

# Menu

navigation:                # accepts {file, title, url, icon, sidebaricon}
  - {file: "Research.md", title: "Projects"}
  - {url: "https://drive.google.com/file/d/1tbzwb9OTnQDk54j6zlJPmaO-R6uj3fzq/view?usp=sharing", title: "CV"}
  - {file: "Teaching.md", title: "Other"}
external:                  # shows a footer with social links - for available icons see fontawesome.com/icons
  - {title: Mail, icon: envelope, url: "mailto:jorge.castaneda@gatech.edu"}
  - {title: Github, icon: github, url: "https://jorgecastanedap.github.com"}
  - {title: LinkedIn, icon: linkedin, url: "https://www.linkedin.com/in/jorgecastanedaperez/"}

comments:
#  disqus_shortname: ""    # see https://disqus.com/
#  isso_domain: ""         # see https://posativ.org/isso/

plugins:
 - jekyll-feed
